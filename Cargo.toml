[package]
name = "agent-socket"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for Agent Socket"
license = "MIT"
repository = "https://github.com/agent-socket/as-rs"
homepage = "https://agent-socket.ai"
keywords = ["agent-socket", "websocket", "agents"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "echo"
path = "examples/echo.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"
